[build]
  command = "pnpm build"
  functions = "dist"
  publish = "dist/client"

[functions]
  directory = "dist"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[context.production]
  command = "pnpm build"
  environment = { NODE_ENV = "production" }

[context.preview]
  command = "pnpm build"
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  command = "pnpm build"
  environment = { NODE_ENV = "production" }
